##############################################################################
#  GAV - Git Accessibility Validator
#  Merge-Request Gate | WCAG 2.1 Enforcement
#
#  Triggers on every Pull Request targeting the main branch.
#  Blocks merge if any HTML, Markdown, or DITA accessibility violation
#  is detected across the changed file set.
##############################################################################

name: GAV Accessibility Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: gav-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  accessibility-gate:
    name: GAV
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: write

    steps:

      # Step 1 - Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2 - Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Step 3 - Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 4 - Install Node dependencies
      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # Step 5 - Install ChromeDriver for axe-core
      - name: Install ChromeDriver
        run: |
          npx browser-driver-manager install chrome

      # Step 6 - Install Python dependencies
      - name: Install Python dependencies
        run: |
          pip install lxml

      # Step 7 - Fetch main branch for diff
      - name: Fetch main branch
        run: |
          git fetch origin main --no-tags

      # Step 8 - Run GAV Validator
      - name: Run GAV Orchestrator
        id: gav
        run: |
          python validator.py 2>&1 | tee gav_report.txt
          exit ${PIPESTATUS[0]}

      # Step 9 - Post results to Pull Request
      - name: Post GAV Summary to PR
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const body = fs.existsSync('gav_report.txt')
              ? fs.readFileSync('gav_report.txt', 'utf8').trim()
              : 'GAV report not generated.';

            const status = '${{ steps.gav.outcome }}' === 'success'
              ? 'All accessibility checks passed.'
              : 'Accessibility violations found - merge is blocked.';

            const comment = [
              '## GAV - Git Accessibility Validator',
              `**${status}**`,
              '',
              '<details><summary>Full Report</summary>',
              '',
              '```',
              body.slice(0, 60000),
              '```',
              '',
              '</details>',
              '',
              `_Triggered by commit \`${{ github.event.pull_request.head.sha }}\`_`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

      # Step 10 - Upload report artifact
      - name: Upload GAV report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gav-accessibility-report
          path: gav_report.txt
          retention-days: 3